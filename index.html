<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR 体験ポータル</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #121212; color: #fff; }
    .card { text-align: center; padding: 2rem; background: #1e1e1e; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 320px; width: 90%; }
    input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #2d2d2d; color: #fff; width: 80%; margin-bottom: 12px; text-align: center; }
    button { padding: 10px 20px; font-size: 16px; border-radius: 6px; border: none; background: #007acc; color: #fff; cursor: pointer; }
    button:hover { background: #005999; }
    .hidden { display: none; }
    img { border: 8px solid #fff; border-radius: 8px; margin-top: 15px; }
    a { color: #4daafc; word-break: break-all; text-decoration: none; display: inline-block; margin-top: 15px; font-size: 14px; }
    a:hover { text-decoration: underline; }
    .error { color: #ff6b6b; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>WebAR 体験ポータル</h2>
    
    <!-- パスワード入力エリア -->
    <div id="login-form">
      <p>パスワードを入力してください</p>
      <input type="password" id="pass-input" placeholder="Password">
      <br>
      <button onclick="checkPass()">送信</button>
      <p id="error-msg" class="error hidden">パスワードが違います</p>
    </div>

    <!-- 認証完了後に表示されるコンテンツ -->
    <div id="content" class="hidden">
      <p>以下のQRまたはURLからアクセスしてください</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://cams-cherry-vertex-manitoba.trycloudflare.com" alt="QR Code"><br>
      <a href="https://cams-cherry-vertex-manitoba.trycloudflare.com" target="_blank" rel="noopener">https://cams-cherry-vertex-manitoba.trycloudflare.com</a>
    </div>
  </div>

  <script>
    function checkPass() {
      const pass = document.getElementById('pass-input').value;
      // ★任意のパスワードに変更可能（現在は "1234"）
      if (pass === "1234") {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
