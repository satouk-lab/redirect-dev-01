<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Dev Lab</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #121212; color: #fff; }
    .card { text-align: center; padding: 2rem; background: #1e1e1e; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 340px; width: 90%; }
    input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #2d2d2d; color: #fff; width: 80%; margin-bottom: 12px; text-align: center; }
    button { padding: 10px 20px; font-size: 16px; border-radius: 6px; border: none; background: #007acc; color: #fff; cursor: pointer; }
    button:hover { background: #005999; }
    .hidden { display: none; }
    img { border: 8px solid #fff; border-radius: 8px; margin-top: 15px; }
    a { color: #4daafc; word-break: break-all; text-decoration: none; display: inline-block; margin-top: 15px; font-size: 14px; font-weight: bold; }
    a:hover { text-decoration: underline; }
    .error { color: #ff6b6b; font-size: 14px; margin-top: 8px; }
    
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
    .status-checking { background: #6c757d; color: #fff; }
    .status-online { background: #28a745; color: #fff; }
    .status-offline { background: #dc3545; color: #fff; }
    .timestamp { font-size: 11px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    2Dev Lab</h2>
    
    <div id="status-container">
      <span id="status-badge" class="status-badge status-checking">CHECKING...</span>
      <div class="timestamp">更新: 2026/08/26 12:46:38 (JST)</div>
    </div>
    
    <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

    <div id="login-form">
      <p>Passcode</p>
      <input type="password" id="pass-input" placeholder="****">
      <br>
      <button onclick="checkPass()">Enter</button>
      <p id="error-msg" class="error hidden">認証エラー</p>
    </div>

    <div id="content" class="hidden">
      <p>Access Link</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://villas-log-searches-taste.trycloudflare.com" alt="QR Code"><br>
      <a href="https://villas-log-searches-taste.trycloudflare.com" target="_blank" rel="noopener">https://villas-log-searches-taste.trycloudflare.com</a>
    </div>
  </div>

  <script>
    const APP_VERSION = "v1.0.3 (2026/08/26 12:46:38)";
    console.log("System Version:", APP_VERSION);

    const targetUrl = "https://villas-log-searches-taste.trycloudflare.com";

    function setStatus(isOnline, reason) {
      const badge = document.getElementById('status-badge');
      if (isOnline) {
        console.log("Status Check: ONLINE -", reason);
        badge.innerText = "● ONLINE";
        badge.className = "status-badge status-online";
      } else {
        console.warn("Status Check: OFFLINE -", reason);
        badge.innerText = "● OFFLINE";
        badge.className = "status-badge status-offline";
      }
    }

    function checkServerStatus() {
      console.log("Status Check: Starting probe...");
      
      let finished = false;
      const img = new Image();

      // 3.5秒タイムアウト処理
      const timeoutId = setTimeout(() => {
        if (!finished) {
          finished = true;
          setStatus(false, "Probe Timeout");
        }
      }, 3500);

      // サーバーが生きていて画像等のリソース応答を返した場合は onload/onerror の挙動で検知
      // 502 Bad Gateway(HTMLページ)が返った場合は画像としてパースできず onerror が発火
      img.onload = () => {
        if (!finished) {
          finished = true;
          clearTimeout(timeoutId);
          setStatus(true, "Favicon loaded");
        }
      };

      img.onerror = () => {
        if (finished) return;
        
        // 通常の fetch でステータスコードを精密判定
        fetch(targetUrl + "/?_=" + Date.now())
          .then(res => {
            finished = true;
            clearTimeout(timeoutId);
            if (res.ok) {
              setStatus(true, "Fetch OK (200)");
            } else {
              // 502 Bad Gateway などを明確に落ちと判定
              setStatus(false, "Server Error Status: " + res.status);
            }
          })
          .catch(err => {
            finished = true;
            clearTimeout(timeoutId);
            // ネットワークエラー、または502によるCORS遮断
            setStatus(false, "Connection Failed / 502 Gateway Error");
          });
      };

      // クエリパラメーターを付与してキャッシュを回避し favicon をプローブ
      img.src = targetUrl + "/favicon.ico?_=" + Date.now();
    }

    checkServerStatus();

    async function checkPass() {
      const pass = document.getElementById('pass-input').value;
      const msgBuffer = new TextEncoder().encode(pass);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      if (hashHex === "8a14e32798ebe8ccc0c459824604e2883e1e26a8460a3834aefaf42fbe44ff72") {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
